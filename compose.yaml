# First start downloads images and the selected tier's model weights only.
# Runtime inference has no internet. FINREPORT_PROFILE=private uses the
# data/config/rules in the private bind mount.
services:
  app:
    build: .
    image: finreport-app
    user: "${FINREPORT_UID:-1000}:${FINREPORT_GID:-1000}"
    environment:
      FINREPORT_PROFILE: ${FINREPORT_PROFILE:-demo}
      FINREPORT_AI_URL: http://ollama:11434
      FINREPORT_AI_TIER: ${FINREPORT_AI_TIER-low}
      FINREPORT_AI_MODEL_LOW: ${FINREPORT_AI_MODEL_LOW-qwen2.5:1.5b}
      FINREPORT_AI_MODEL_MEDIUM: ${FINREPORT_AI_MODEL_MEDIUM-qwen2.5:7b-instruct-q3_K_M}
      FINREPORT_AI_MODEL_HIGH: ${FINREPORT_AI_MODEL_HIGH-qwen2.5:14b-instruct-q3_K_L}
    ports:
      - "127.0.0.1:${FINREPORT_PORT:-8010}:8010"
    volumes:
      - ${FINREPORT_PRIVATE_DIR:-./private}:/app/private
    networks:
      # Docker needs a non-internal network to publish the localhost web port.
      - web
      - inference
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/api/files',timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.7
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - inference
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Only this one-off process can download models, and it downloads the
  # selected tier only. It never mounts financial data. A private temporary
  # daemon writes the weights before the runtime daemon starts.
  model-init:
    image: ollama/ollama:0.40.7
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      FINREPORT_AI_TIER: ${FINREPORT_AI_TIER-low}
      FINREPORT_AI_MODEL_LOW: ${FINREPORT_AI_MODEL_LOW-qwen2.5:1.5b}
      FINREPORT_AI_MODEL_MEDIUM: ${FINREPORT_AI_MODEL_MEDIUM-qwen2.5:7b-instruct-q3_K_M}
      FINREPORT_AI_MODEL_HIGH: ${FINREPORT_AI_MODEL_HIGH-qwen2.5:14b-instruct-q3_K_L}
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - model-download
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for value in "$$FINREPORT_AI_MODEL_LOW" "$$FINREPORT_AI_MODEL_MEDIUM" "$$FINREPORT_AI_MODEL_HIGH"; do
          case "$$value" in
            ""|-*|*[[:space:]]*) echo "Each tier must name a single Ollama model" >&2; exit 1 ;;
          esac
        done
        case "$$FINREPORT_AI_TIER" in
          low) model="$$FINREPORT_AI_MODEL_LOW" ;;
          medium) model="$$FINREPORT_AI_MODEL_MEDIUM" ;;
          high) model="$$FINREPORT_AI_MODEL_HIGH" ;;
          *) echo "FINREPORT_AI_TIER must be low, medium or high" >&2; exit 1 ;;
        esac
        ollama serve &
        pid=$$!
        trap 'kill "$$pid" 2>/dev/null || true' EXIT INT TERM
        attempts=0
        until ollama list >/dev/null 2>&1; do
          kill -0 "$$pid"
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 60 ]; then echo 'Model initializer did not start'; exit 1; fi
          sleep 1
        done
        if ! ollama show "$$model" >/dev/null 2>&1; then
          timeout 3600 ollama pull "$$model"
        fi
        ollama show "$$model"
    restart: "no"

volumes:
  ollama-models:

networks:
  web:
    driver: bridge
  inference:
    internal: true
  model-download:
    driver: bridge
